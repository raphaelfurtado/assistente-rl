ill-opacity="0.16"/><rect x="489" y="189" width="90" height="90" rx="3" fill="#d03b3b" fill-opacity="0.16"/><rect x="489" y="97" width="90" height="90" rx="3" fill="#d03b3b" fill-opacity="0.16"/><text x="166" y="576" font-size="12" fill="#52514e" text-anchor="middle">1</text><text x="108" y="514" font-size="12" fill="#52514e" text-anchor="end">1</text><text x="258" y="576" font-size="12" fill="#52514e" text-anchor="middle">2</text><text x="108" y="422" font-size="12" fill="#52514e" text-anchor="end">2</text><text x="350" y="576" font-size="12" fill="#52514e" text-anchor="middle">3</text><text x="108" y="330" font-size="12" fill="#52514e" text-anchor="end">3</text><text x="442" y="576" font-size="12" fill="#52514e" text-anchor="middle">4</text><text x="108" y="238" font-size="12" fill="#52514e" text-anchor="end">4</text><text x="534" y="576" font-size="12" fill="#52514e" text-anchor="middle">5</text><text x="108" y="146" font-size="12" fill="#52514e" text-anchor="end">5</text><text x="350" y="600" font-size="12.5" fill="#0b0b0b" text-anchor="middle" font-weight="600">Probabilidade →</text><text transform="translate(74 326) rotate(-90)" font-size="12.5" fill="#0b0b0b" text-anchor="middle" font-weight="600">Impacto →</text><circle cx="324" cy="118" r="11" fill="#0b0b0b"><title>R1 · Base de conhecimento desatualizada ou com fontes divergentes: P3 × I5</title></circle><text x="324" y="122" font-size="10.5" font-weight="600" fill="#ffffff" text-anchor="middle">1</text><circle cx="416" cy="302" r="11" fill="#0b0b0b"><title>R2 · Afirmar algo que a base não diz (ausência vira afirmação): P4 × I3</title></circle><text x="416" y="306" font-size="10.5" font-weight="600" fill="#ffffff" text-anchor="middle">2</text><circle cx="232" cy="118" r="11" fill="#0b0b0b"><title>R3 · Alucinação grave mesmo com a base no prompt: P2 × I5</title></circle><text x="232" y="122" font-size="10.5" font-weight="600" fill="#ffffff" text-anchor="middle">3</text><circle cx="324" cy="210" r="11" fill="#0b0b0b"><title>R4 · Atualização do modelo pelo provedor muda o comportamento: P3 × I4</title></circle><text x="324" y="214" font-size="10.5" font-weight="600" fill="#ffffff" text-anchor="middle">4</text><circle cx="350" cy="210" r="11" fill="#0b0b0b"><title>R5 · Dados pessoais enviados ao provedor do LLM (LGPD): P3 × I4</title></circle><text x="350" y="214" font-size="10.5" font-weight="600" fill="#ffffff" text-anchor="middle">5</text><circle cx="416" cy="394" r="11" fill="#0b0b0b"><title>R6 · Custo e janela de contexto crescem com a base: P4 × I2</title></circle><text x="416" y="398" font-size="10.5" font-weight="600" fill="#ffffff" text-anchor="middle">6</text><circle cx="324" cy="302" r="11" fill="#0b0b0b"><title>R7 · Resposta segura, mas incompleta em casos urgentes: P3 × I3</title></circle><text x="324" y="306" font-size="10.5" font-weight="600" fill="#ffffff" text-anchor="middle">7</text><circle cx="350" cy="302" r="11" fill="#0b0b0b"><title>R8 · Avaliador automático (LLM juiz) erra ou é rigoroso demais: P3 × I3</title></circle><text x="350" y="306" font-size="10.5" font-weight="600" fill="#ffffff" text-anchor="middle">8</text><circle cx="232" cy="210" r="11" fill="#0b0b0b"><title>R9 · Manipulação do prompt (prompt injection): P2 × I4</title></circle><text x="232" y="214" font-size="10.5" font-weight="600" fill="#ffffff" text-anchor="middle">9</text><circle cx="232" cy="302" r="11" fill="#0b0b0b"><title>R10 · Estrutura obrigatória induz conteúdo inventado: P2 × I3</title></circle><text x="232" y="306" font-size="10.5" font-weight="600" fill="#ffffff" text-anchor="middle">10</text><circle cx="258" cy="302" r="11" fill="#0b0b0b"><title>R11 · Indisponibilidade ou lentidão da API do LLM: P2 × I3</title></circle><text x="258" y="306" font-size="10.5" font-weight="600" fill="#ffffff" text-anchor="middle">11</text><circle cx="232" cy="394" r="11" fill="#0b0b0b"><title>R12 · Variação de texto entre execuções: P2 × I2</title></circle><text x="232" y="398" font-size="10.5" font-weight="600" fill="#ffffff" text-anchor="middle">12</text><rect x="608" y="100" width="16" height="16" rx="3" fill="#d03b3b" fill-opacity="0.35"/><text x="632" y="112.5" font-size="12" fill="#0b0b0b">Crítico (15–25)</text><rect x="608" y="124" width="16" height="16" rx="3" fill="#ec835a" fill-opacity="0.35"/><text x="632" y="136.5" font-size="12" fill="#0b0b0b">Alto (10–14)</text><rect x="608" y="148" width="16" height="16" rx="3" fill="#fab219" fill-opacity="0.35"/><text x="632" y="160.5" font-size="12" fill="#0b0b0b">Médio (5–9)</text><rect x="608" y="172" width="16" height="16" rx="3" fill="#0ca30c" fill-opacity="0.35"/><text x="632" y="184.5" font-size="12" fill="#0b0b0b">Baixo (1–4)</text><text x="608" y="210" font-size="11.5" fill="#0b0b0b"><tspan font-weight="600">R1</tspan> Base desatualizada/divergente (15)</text><text x="608" y="228" font-size="11.5" fill="#0b0b0b"><tspan font-weight="600">R2</tspan> Ausência vira afirmação (12)</text><text x="608" y="246" font-size="11.5" fill="#0b0b0b"><tspan font-weight="600">R4</tspan> Modelo muda sem aviso (12)</text><text x="608" y="264" font-size="11.5" fill="#0b0b0b"><tspan font-weight="600">R5</tspan> Dados pessoais (LGPD) (12)</text><text x="608" y="282" font-size="11.5" fill="#0b0b0b"><tspan font-weight="600">R3</tspan> Alucinação grave com base (10)</text><text x="608" y="300" font-size="11.5" fill="#0b0b0b"><tspan font-weight="600">R7</tspan> Incompleta na urgência (9)</text><text x="608" y="318" font-size="11.5" fill="#0b0b0b"><tspan font-weight="600">R8</tspan> Erro do avaliador (9)</text><text x="608" y="336" font-size="11.5" fill="#0b0b0b"><tspan font-weight="600">R6</tspan> Custo/contexto crescem (8)</text><text x="608" y="354" font-size="11.5" fill="#0b0b0b"><tspan font-weight="600">R9</tspan> Prompt injection (8)</text><text x="608" y="372" font-size="11.5" fill="#0b0b0b"><tspan font-weight="600">R10</tspan> Formato induz invenção (6)</text><text x="608" y="390" font-size="11.5" fill="#0b0b0b"><tspan font-weight="600">R11</tspan> API fora/lenta (6)</text><text x="608" y="408" font-size="11.5" fill="#0b0b0b"><tspan font-weight="600">R12</tspan> Variação entre execuções (4)</text>
</svg>